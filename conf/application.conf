# This is the main configuration file for the application.
# ~~~~~

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
#
# This must be changed for production, but we recommend not changing it in this file.
#
# See http://www.playframework.com/documentation/latest/ApplicationSecret for more details.
play.http.secret.key="changeme"

# The application languages
# ~~~~~
play.i18n.langs=["en"]

play.application.loader = AppLoader

logger-startup-timeout = 30s

google.tracking.id=""

# Fallback value used in local dev (overridden by SSM in deployed environments)
logging.stream = "local"

# Local-only override: when set, every flexible-content stack API is pointed at
# this base URL instead of its real per-stage host (used by the local mock).
flexible.api.baseUrl = ${?FLEXIBLE_API_BASE_URL}
