name: E2E Tests

on:
    pull_request:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    e2e:
        runs-on: ubuntu-latest

        permissions:
            # Required for `actions/checkout`
            contents: read

        steps:
            - uses: actions/checkout@v4

            # The app build targets an older Node (see .nvmrc), but the Playwright
            # e2e suite is its own sub-package (tests/) that needs Node 18+.
            # Install a modern Node explicitly and cache from the e2e lockfile.
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: 'tests/package-lock.json'

            # Pre-build the Testcontainers images up front (the restorer image
            # compiles the Scala app, which is slow on a cold cache). The e2e
            # global setup rebuilds these with a run-specific tag, but Docker's
            # layer cache is keyed by content, so those in-test builds become
            # fast cache hits — keeping them within the suite's global timeout.
            - name: Pre-build e2e Docker images
              run: |
                  docker build -f images/minio.Dockerfile -t flexible-restorer-minio-e2e:prebuild .
                  docker build -f images/mock-flexible-api.Dockerfile -t flexible-restorer-mock-api-e2e:prebuild .
                  docker build -f images/restorer.Dockerfile -t flexible-restorer-app-e2e:prebuild .

            - name: Run e2e tests
              # Generate the Cucumber HTML report as well as the default output.
              env:
                  REPORT: '1'
              run: npm run test:e2e

            # Publish the test results (Playwright traces/videos/screenshots and
            # the Cucumber HTML report) even when the run fails.
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-test-results
                  path: |
                      tests/test-results/
                      tests/playwright-report/
                      tests/cucumber-report/
                  if-no-files-found: ignore
                  retention-days: 14
