name: E2E Tests

on:
    # Invoked as a reusable workflow by ci.yml so the Riff-Raff upload can gate
    # on the e2e result. Also runnable on its own via the Actions UI.
    workflow_call:
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ubuntu-24.04

        permissions:
            # Required for `actions/checkout`
            contents: read

        env:
            # The workflow's automatic token, exposed so the e2e stack (and any
            # `gh`/GitHub API calls it makes) is authenticated and avoids the
            # low unauthenticated rate limit.
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The Playwright e2e suite (e2e-tests/) needs Node 18+. Install a
            # modern Node explicitly and cache from the root lockfile, which now
            # includes the e2e dependencies.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ".tool-versions"
                  cache: npm
                  cache-dependency-path: "package-lock.json"

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-

            - name: Install Playwright browser
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install chromium

            # Like Grid, rely on the hosted runner's Chromium system libraries.
            # Verify they are sufficient on cache hits and misses before building
            # the stack, without downloading Linux packages on every run.
            - name: Verify Chromium can launch
              run: |
                  node --input-type=module <<'NODE'
                  import { chromium } from 'playwright';
                  const browser = await chromium.launch();
                  await browser.close();
                  NODE

            # Pre-build images before the suite starts so Scala compilation stays
            # outside its timeout. Buildx restores and saves layers between runs
            # using the GitHub Actions cache, with a separate scope per image.
            # load: true makes the images available to the local Docker engine;
            # the E2E_*_IMAGE variables below tell Testcontainers to use them
            # directly, avoiding a second build through its separate builder.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Pull LocalStack image
              run: docker pull localstack/localstack:4

            - name: Build mock API image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: e2e-tests/images/mock-flexible-api.Dockerfile
                  tags: flexible-restorer-mock-api-e2e:prebuild
                  load: true
                  push: false
                  cache-from: type=gha,scope=e2e-mock-api
                  cache-to: type=gha,scope=e2e-mock-api,mode=max

            - name: Build Restorer image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: e2e-tests/images/restorer.Dockerfile
                  tags: flexible-restorer-app-e2e:prebuild
                  load: true
                  push: false
                  cache-from: type=gha,scope=e2e-restorer
                  cache-to: type=gha,scope=e2e-restorer,mode=max

            - name: Build nginx image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: e2e-tests/images/nginx.Dockerfile
                  tags: flexible-restorer-nginx-e2e:prebuild
                  load: true
                  push: false
                  cache-from: type=gha,scope=e2e-nginx
                  cache-to: type=gha,scope=e2e-nginx,mode=max

            - name: Run e2e tests
              # Generate the BDD tests from the feature files, then run them.
              # REPORT=1 also produces the Cucumber HTML report.
              env:
                  REPORT: "1"
                  E2E_RESTORER_IMAGE: flexible-restorer-app-e2e:prebuild
                  E2E_MOCK_API_IMAGE: flexible-restorer-mock-api-e2e:prebuild
                  E2E_NGINX_IMAGE: flexible-restorer-nginx-e2e:prebuild
              run: |
                  npx bddgen --config=e2e-tests/playwright.config.js
                  npm run test:ci

            # Publish the test results (Playwright traces/videos/screenshots and
            # the Cucumber HTML report) even when the run fails.
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-test-results
                  # Playwright resolves outputDir and the Cucumber report's
                  # outputFile relative to the config dir (e2e-tests/), so both
                  # artifacts land under e2e-tests/, not the repo root.
                  path: |
                      e2e-tests/test-results/
                      e2e-tests/cucumber-report/
                  if-no-files-found: ignore
                  retention-days: 14
