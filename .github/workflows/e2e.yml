name: E2E Tests

on:
    # Invoked as a reusable workflow by ci.yml so the Riff-Raff upload can gate
    # on the e2e result. Also runnable on its own via the Actions UI.
    workflow_call:
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ubuntu-latest

        permissions:
            # Required for `actions/checkout`
            contents: read

        env:
            # The workflow's automatic token, exposed so the e2e stack (and any
            # `gh`/GitHub API calls it makes) is authenticated and avoids the
            # low unauthenticated rate limit.
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The Playwright e2e suite (e2e-tests/) needs Node 18+. Install a
            # modern Node explicitly and cache from the root lockfile, which now
            # includes the e2e dependencies.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ".tool-versions"
                  cache: npm
                  cache-dependency-path: "package-lock.json"

            - name: Install dependencies
              run: npm ci

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-

            - name: Install Playwright browser
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install chromium

            - name: Verify Chromium can launch
              run: npx tsx e2e-tests/setup/verify-chromium.ts

            # Pre-build images before the suite starts so Scala compilation stays
            # outside its timeout. Buildx restores and saves layers between runs
            # using the GitHub Actions cache, with a separate scope per image.
            # The E2E_*_IMAGE variables below reuse the loaded images directly.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Pre-build e2e Docker images
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              env:
                  E2E_BUILD_CACHE: gha
              with:
                  script: await exec.exec('npm', ['run', 'e2e:prebuild']);

            - name: Run e2e tests
              # Generate the BDD tests from the feature files, then run them.
              # REPORT=1 also produces the Cucumber HTML report.
              env:
                  REPORT: "1"
                  E2E_RESTORER_IMAGE: flexible-restorer-app-e2e:prebuild
                  E2E_MOCK_API_IMAGE: flexible-restorer-mock-api-e2e:prebuild
                  E2E_NGINX_IMAGE: flexible-restorer-nginx-e2e:prebuild
              run: |
                  npx bddgen --config=e2e-tests/playwright.config.js
                  npm run test:ci

            # Publish both HTML reports, including captured attachments, after
            # successful or failed runs, but not cancelled runs.
            - name: Upload e2e reports
              id: e2e-report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-report
                  path: |
                      e2e-tests/playwright-report/
                      e2e-tests/cucumber-report/
                      e2e-tests/artifacts/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Link to e2e reports and logs
              if: ${{ failure() && steps.e2e-report.outputs.artifact-url != '' }}
              env:
                  REPORT_URL: ${{ steps.e2e-report.outputs.artifact-url }}
              run: |
                  echo "::error title=E2E reports and logs::See the reports and stack logs for this failed run: $REPORT_URL"
