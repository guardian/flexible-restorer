name: E2E Tests

on:
    # Invoked as a reusable workflow by ci.yml so the Riff-Raff upload can gate
    # on the e2e result. Also runnable on its own via the Actions UI.
    workflow_call:
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ubuntu-latest

        permissions:
            # Required for `actions/checkout`
            contents: read

        env:
            # The workflow's automatic token, exposed so the e2e stack (and any
            # `gh`/GitHub API calls it makes) is authenticated and avoids the
            # low unauthenticated rate limit.
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The Playwright e2e suite (e2e-tests/) needs Node 18+. Install a
            # modern Node explicitly and cache from the root lockfile, which now
            # includes the e2e dependencies.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.tool-versions'
                  cache: npm
                  cache-dependency-path: 'package-lock.json'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            # Pre-build the Testcontainers images up front (the restorer image
            # compiles the Scala app, which is slow on a cold cache). The e2e
            # global setup rebuilds these with a run-specific tag, but Docker's
            # layer cache is keyed by content, so those in-test builds become
            # fast cache hits — keeping them within the suite's global timeout.
            - name: Pre-build e2e Docker images
              run: |
                  docker pull localstack/localstack:4
                  docker build -f e2e-tests/images/mock-flexible-api.Dockerfile -t flexible-restorer-mock-api-e2e:prebuild .
                  docker build -f e2e-tests/images/restorer.Dockerfile -t flexible-restorer-app-e2e:prebuild .

            - name: Run e2e tests
              # Generate the BDD tests from the feature files, then run them.
              # REPORT=1 also produces the Cucumber HTML report.
              env:
                  REPORT: '1'
              run: |
                  npx bddgen --config=e2e-tests/playwright.config.js
                  npm run test:ci

            # Publish the test results (Playwright traces/videos/screenshots and
            # the Cucumber HTML report) even when the run fails.
            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-test-results
                  # Playwright resolves outputDir and the Cucumber report's
                  # outputFile relative to the config dir (e2e-tests/), so both
                  # artifacts land under e2e-tests/, not the repo root.
                  path: |
                      e2e-tests/test-results/
                      e2e-tests/cucumber-report/
                  if-no-files-found: ignore
                  retention-days: 14
