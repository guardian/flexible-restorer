name: CI
on:
    pull_request:
    workflow_dispatch:
    push:
        branches:
            - main
jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Required for `actions/checkout`
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ".tool-versions"
                  cache: npm
                  cache-dependency-path: "package-lock.json"

            - name: JS Build
              run: |
                  npm ci
                  npm run build

            - name: JS Lint
              run: npm run lint

            - name: JS Unit Tests
              run: npm run test:unit

            - uses: guardian/setup-scala@ac4ece07deb7cef715b8c975d4b8c77109c89ce8 # v1.1.3

            - name: Scala Build
              run: |
                  sbt clean compile test Debian/packageBin

            - name: Rename file to match Launch Configuration in AWS
              run: |
                  mv target/restorer2_1.0.0_all.deb restorer2.deb

            - name: Setup Node (CDK)
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: 'cdk/.nvmrc'
                  cache: npm
                  cache-dependency-path: 'cdk/package-lock.json'

            - name: CDK build
              working-directory: cdk
              run: |
                  npm ci
                  npm run lint
                  npm test
                  npm run synth

            # Hand the deployable artifacts to the riff-raff job, which only runs
            # once the e2e tests have also passed.
            - name: Upload build artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: riff-raff-artifacts
                  path: |
                      restorer2.deb
                      cdk/cdk.out/Restorer2-euwest-1-CODE.template.json
                      cdk/cdk.out/Restorer2-euwest-1-PROD.template.json
                  if-no-files-found: error
                  retention-days: 1

    e2e:
        # Run the e2e suite as part of CI so the deploy can depend on it.
        permissions:
            # Default to least privilege for reusable workflow invocation.
            contents: read
        uses: ./.github/workflows/e2e.yml
        secrets: inherit

    riff-raff:
        # On main, only upload to Riff-Raff once the e2e tests have also passed.
        if: github.ref == 'refs/heads/main'
        needs: [build, e2e]
        runs-on: ubuntu-latest

        permissions: &riff-raff-permissions
            # id-token and pull-requests required by actions-riff-raff
            id-token: write
            pull-requests: write
            # Required for `actions/checkout`
            contents: read

        steps: &riff-raff-steps
            # Needed for riff-raff.yaml (configPath) and the git context.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download build artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: riff-raff-artifacts

            # Upload our build artifacts to Riff-Raff (well, S3)
            - uses: guardian/actions-riff-raff@eecac3ac4f7a446dd59aaa636163c9ae88baf4a4 # v4.3.6
              with:
                  projectName: editorial-tools:flexible:restorer2
                  buildNumberOffset: 298
                  roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
                  githubToken: ${{ secrets.GITHUB_TOKEN }}
                  configPath: riff-raff.yaml
                  contentDirectories: |
                      restorer2:
                        - restorer2.deb
                      cfn-restorer2:
                        - cdk/cdk.out/Restorer2-euwest-1-CODE.template.json
                        - cdk/cdk.out/Restorer2-euwest-1-PROD.template.json

    riff-raff-branch:
        # Off main, upload as soon as the build passes without waiting on e2e.
        if: github.ref != 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions: *riff-raff-permissions
        steps: *riff-raff-steps
