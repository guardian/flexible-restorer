# Devenv project configuration
# Edit this file to configure your project's devcontainer
# and then run `devenv generate` to create the devcontainer.json files

# REQUIRED: Change this to your project name
name: "flexible-restorer"

# Modules: Built-in functionality
# - mise: Install and configure mise for dev tools management (https://mise.jdx.dev/)
# - docker-in-docker: Enable running Docker containers within the devcontainer
# - scala: Add IDE plugins and jar caching for Scala development
# - node: Add IDE plugins for Node.js development
# To disable, comment out or remove items from this list
modules:
  - mise
  - docker-in-docker # (disabled by default)
  - scala # (disabled by default)
  - node # (disabled by default)
  - github-copilot

  # Optional: Ports to forward
forwardPorts:
  - 9000 # same port on host and container
  - 9323 # Playwright UI server (npm run test:ui)
#   - "8000:9000"  # hostPort:containerPort

# Optional: Mount directories from host to container
# mounts:
#   - "source=${localEnv:HOME}/.gu/example,target=/home/vscode/.gu/example,readonly,type=bind,consistency=cached"

# Optional: IDE plugins - shared project plugins like language support
# plugins:
#   vscode: []
#   intellij: []

# Optional: Commands to run after container creation
# Each command has a 'cmd' field and a 'workingDirectory' field
# e.g.
# Commands run in a non-interactive /bin/sh that doesn't source ~/.bashrc, so the
# mise shims (which provide node/npm/npx) aren't on PATH. Prepend the shims dir
# explicitly so npm/npx resolve to the mise-managed node. This is because we are not using 
# the mise module's built-in node support, which would automatically add the shims to PATH.
#
# Pre-build the e2e/dev Docker images so their layer cache is already warm when
# the user later runs `run-dev-local` (npm run dev:local); the run then reuses
# these layers instead of building from scratch. Also install Playwright's
# Chromium browser and its system libraries so the e2e suite can launch a
# (headless) browser inside the devcontainer.
postCreateCommand:
  - cmd: 'PATH="$HOME/.local/share/mise/shims:$PATH" npm ci'
    workingDirectory: "."
  - cmd: 'PATH="$HOME/.local/share/mise/shims:$PATH" npx playwright install chromium --with-deps'
    workingDirectory: "."
  - cmd: "docker build -f e2e-tests/images/minio.Dockerfile -t flexible-restorer-minio-e2e:cache ."
    workingDirectory: "."
  - cmd: "docker build -f e2e-tests/images/restorer.Dockerfile -t flexible-restorer-app-e2e:cache ."
    workingDirectory: "."
  - cmd: "docker build -f e2e-tests/images/nginx.Dockerfile -t flexible-restorer-nginx-e2e:cache ."
    workingDirectory: "."
