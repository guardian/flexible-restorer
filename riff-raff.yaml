regions: [eu-west-1]
stacks: [flexible]

deployments:
  cfn-restorer2:
    type: cloud-formation
    app: restorer2
    parameters:
      templateStagePaths:
        CODE: Restorer2-euwest-1-CODE.template.json
        PROD: Restorer2-euwest-1-PROD.template.json
      cloudFormationStackName: Flexible-Restorer
      cloudFormationStackByTags: false
      prependStackToCloudFormationStackName: false
      # During the dual-stack migration there are two AMI parameters, one per
      # ASG: the legacy launch configuration (AMI) and the new GuEc2App launch
      # template (AMIRestorer2). Same recipe for both; drop AMI once the
      # legacy ASG/ELB is decommissioned (Phase 3).
      amiParametersToTags:
        AMI:
          Recipe: editorial-tools-jammy-java11
          AmigoStage: PROD
          BuiltBy: amigo
        AMIRestorer2:
          Recipe: editorial-tools-jammy-java11
          AmigoStage: PROD
          BuiltBy: amigo
      amiEncrypted: true
  restorer2:
    type: autoscaling
    parameters:
      # Both the legacy ASG and the new GuEc2App ASG are tagged App=restorer2.
      # This tells Riff-Raff to target only the ASG tagged gu:riffraff:new-asg.
      asgMigrationInProgress: true
    dependencies:
      - cfn-restorer2
