<!-- ERROR STATUS (migrated to React; see components/error-modal) -->
<error-modal></error-modal>

<!-- HEADER -->
<app-header></app-header>

<!-- PRELOADER -->
<div ng-if="isLoading">
    <gu-loading-bars></gu-loading-bars>
</div>

<gu-row ng-if="!isLoading" class="content">
    <!-- SNAPSHOT SIDEBAR (migrated to React; see components/snapshot-sidebar) -->
    <snapshot-sidebar class="col-4" content-id="contentId"></snapshot-sidebar>

    <!-- CONTENT (migrated to React; see components/content-viewer) -->
    <snapshot-content-viewer class="col-8" content-id="contentId"></snapshot-content-viewer>

    <!-- MODAL (migrated to React; see components/restore-modal) -->
    <restore-modal content-id="contentId"></restore-modal>

</gu-row>
