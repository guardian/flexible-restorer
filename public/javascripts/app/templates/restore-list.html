<!-- ERROR STATUS -->
<div style="display: none" class="modal center" ng-controller="ErrorCtrl as errorCtrl"
    ng-class="{ 'visually-hidden': !errorCtrl.hasError }">
    <gu-box class="modal__content" variant="primary">
        <gu-row class="modal__content__form__fieldset">
            <gu-column span="12">
                <h1 class="modal__content__title">Ooops, something went wrong</h1>
                {{ errorCtrl.errorContent }}
            </gu-column>
        </gu-row>
        <gu-row variant="reverse" class="modal__content__form__fieldset">
            <!-- TODO ADD BACK TO COMPOSER BUTTON JP 15/4/15 -->
        </gu-row>
    </gu-box>
</div>

<!-- HEADER -->
<gu-row skin="header" ng-include src="'/assets/javascripts/app/templates/partials/header.html'"></gu-row>

<!-- PRELOADER -->
<div ng-if="isLoading">
    <gu-loading-bars></gu-loading-bars>
</div>

<gu-row ng-if="!isLoading" class="content">
    <!-- SNAPSHOT SIDEBAR (migrated to React; see components/snapshot-sidebar) -->
    <snapshot-sidebar class="col-4" content-id="contentId"></snapshot-sidebar>

    <!-- CONTENT (migrated to React; see components/content-viewer) -->
    <snapshot-content-viewer class="col-8" content-id="contentId"></snapshot-content-viewer>

    <!-- MODAL (migrated to React; see components/restore-modal) -->
    <restore-modal content-id="contentId"></restore-modal>

</gu-row>
